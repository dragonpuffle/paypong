name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paypong
          POSTGRES_PASSWORD: paypong
          POSTGRES_DB: paypong_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paypong -d paypong_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: paypong
          RABBITMQ_DEFAULT_PASS: paypong
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://paypong:paypong@localhost:5432/paypong_test
      TEST_RABBITMQ_URL: amqp://paypong:paypong@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run python scripts/checks/verify.py --project . --integration
